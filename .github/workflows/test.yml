name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # ASYNC rules find blocking calls (open, time.sleep, Path methods) in async def.
      - run: ruff check custom_components tests ci scripts

  changelog-release-gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ci/check-changelog-release-gap.py needs the base branch's history and
          # every release tag to tell an already-shipped section from one still
          # being iterated.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard against editing an already-released CHANGELOG section
        run: python3 ci/check-changelog-release-gap.py

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash ci/test-unit.sh

  integration-fake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Keeper's test fake imports Home Assistant. On 3.12 pip resolves a
          # Home Assistant too old to import it, and the lane ran nothing.
          python-version: "3.13"
      - run: bash ci/test-integration.sh

  e2e-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash ci/test-docker.sh
      - name: Upload Home Assistant log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-log-docker
          path: ha-docker.log
          if-no-files-found: warn

      # Last step. The log must have no warnings or errors from our code, no
      # "Detected blocking call" for our domain, and no known bad patterns.
      # Add exceptions to scripts/ha_log_allowlist.txt (with a reason).
      - name: Check Home Assistant log
        if: always()
        run: python3 scripts/check_ha_log.py --domain home_keeper_battery_notes ha-docker.log

  e2e-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash ci/e2e-up.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload Home Assistant log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-log-browser
          path: ha-browser.log
          if-no-files-found: warn

      # Last step. The log must have no warnings or errors from our code, no
      # "Detected blocking call" for our domain, and no known bad patterns.
      # Add exceptions to scripts/ha_log_allowlist.txt (with a reason).
      - name: Check Home Assistant log
        if: always()
        run: python3 scripts/check_ha_log.py --domain home_keeper_battery_notes ha-browser.log
